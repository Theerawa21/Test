<style>
:root{
  --ink:#0F2547;         /* deep exam-hall navy */
  --ink-soft:#3B527A;
  --paper:#F6F8FB;       /* cool paper */
  --card:#FFFFFF;
  --line:#D8E0EC;
  --gold:#B98A1F;        /* school crest gold */
  --gold-soft:#F4E9CF;
  --teal:#0E7C7B;        /* status green-teal */

}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
header{background:var(--ink);color:#fff;padding:28px 20px 88px;position:relative}
.head-inner{max-width:860px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:6px}
h1{font-size:clamp(22px,4.5vw,32px);font-weight:800;line-height:1.25}
.sub{margin-top:6px;color:#B9C6DC;font-size:14px}
.sub b{color:#fff}
.search-wrap{max-width:860px;margin:-56px auto 0;padding:0 20px}
.search-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(15,37,71,.12);padding:18px}
.search-box{position:relative}
.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
input#q{width:100%;padding:15px 16px 15px 48px;font-size:17px;font-family:inherit;border:2px solid var(--line);border-radius:12px;outline:none;transition:border-color .15s;color:var(--ink)}
input#q:focus{border-color:var(--gold)}
input#q::placeholder{color:#9AA9C0}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.meta{max-width:860px;margin:14px auto 0;padding:0 20px;display:flex;justify-content:space-between;align-items:baseline}
.count{font-size:13px;color:var(--ink-soft)}
.count b{color:var(--ink);font-size:15px}
main{max-width:860px;margin:10px auto 60px;padding:0 20px;display:grid;gap:12px}
/* result = exam slip */
.slip{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.slip-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(to right,var(--gold-soft),#fff 70%);border-bottom:1px dashed var(--line)}
.who{font-size:17px;font-weight:700}
.tags{display:flex;gap:6px;flex-shrink:0}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff;white-space:nowrap}
.tag.no{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.slip-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}
.field{padding:12px 16px;border-top:1px solid #EEF2F8}
.field .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:3px}
.field .val{font-family:var(--mono);font-size:16px;font-weight:600;word-break:break-all;display:flex;align-items:center;gap:8px}
.val u{text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px}
.copy{border:none;background:none;cursor:pointer;color:#9AA9C0;padding:2px;border-radius:6px;display:inline-flex;transition:color .12s}
.copy:hover{color:var(--gold)}
.copy.done{color:var(--teal)}
.hint{font-size:12px;color:var(--ink-soft);padding:9px 16px;background:#FBF7EC;border-top:1px solid var(--line)}
.hint u{text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px}
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.empty .big{font-size:40px;margin-bottom:10px}
.empty p{font-size:15px}
footer{text-align:center;font-size:12px;color:#9AA9C0;padding:0 20px 40px}
footer a{color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.slip{animation:none}}
@media (max-width:520px){
  .slip-top{flex-direction:column;align-items:flex-start}
  .slip-body{grid-template-columns:1fr 1fr}
}
</style>

: "ม.6/5", "no": 49, "ref": "Student 049", "group": "651756", "user": "u15223019", "pwd": "z6YjMTpK", "org": "103713", "sid": "19723", "name": "นางสาวอธิชานันท์", "surname": "จันทรศิริ"}];
const q = document.getElementById('q');
const results = document.getElementById('results');
const countEl = document.getElementById('count');
let room = '';

const iconCopy = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const iconCheck = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 7"/></svg>';

function markDigits(s){
  return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\d+/g,'<u>$&</u>');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,'');}

function render(){
  const term = norm(q.value);
  const hits = DATA.filter(d=>{
    if(room && d.room !== room) return false;
    if(!term) return true;
    const hay = norm(d.name + d.surname + d.sid + d.user + d.ref + d.no + d.room);
    return hay.includes(term);
  });
  countEl.innerHTML = term || room
    ? 'พบ <b>' + hits.length + '</b> รายการ จากทั้งหมด ' + DATA.length + ' คน'
    : 'นักเรียนทั้งหมด <b>' + DATA.length + '</b> คน — พิมพ์ค้นหาเพื่อหารหัสของคุณ';
  if(!hits.length){
    results.innerHTML = '<div class="empty"><div class="big">🔍</div><p>ไม่พบข้อมูล — ลองพิมพ์แค่ชื่อจริงบางส่วน หรือตรวจเลขประจำตัวอีกครั้ง</p></div>';
    return;
  }
  const shown = hits.slice(0, 30);
  results.innerHTML = shown.map(d=>`
    <div class="slip">
      <div class="slip-top">
        <div class="who">${esc(d.name)} ${esc(d.surname)}</div>
        <div class="tags"><span class="tag no">เลขที่ ${esc(d.no)}</span><span class="tag">${esc(d.room)}</span></div>
      </div>
      <div class="slip-body">
        <div class="field"><div class="lbl">Username</div><div class="val">${esc(d.user)}<button class="copy" data-v="${esc(d.user)}" title="คัดลอก">${iconCopy}</button></div></div>
        <div class="field"><div class="lbl">Password</div><div class="val">${markDigits(d.pwd)}<button class="copy" data-v="${esc(d.pwd)}" title="คัดลอก">${iconCopy}</button></div></div>
        <div class="field"><div class="lbl">Org ID</div><div class="val">${esc(d.org)}<button class="copy" data-v="${esc(d.org)}" title="คัดลอก">${iconCopy}</button></div></div>
        <div class="field"><div class="lbl">เลขประจำตัว</div><div class="val">${esc(d.sid)}</div></div>
        <div class="field"><div class="lbl">รหัสอ้างอิง</div><div class="val">${esc(d.ref)}</div></div>
        <div class="field"><div class="lbl">Group</div><div class="val">${esc(d.group)}</div></div>
      </div>
      <div class="hint">พิมพ์รหัสผ่านตามตัวอักษรเป๊ะ ๆ (เล็ก-ใหญ่มีผล) · ตัวที่ขีดเส้นใต้คือ<u>ตัวเลข</u></div>
    </div>`).join('') + (hits.length>30 ? '<div class="empty"><p>แสดง 30 รายการแรก — พิมพ์ให้เจาะจงขึ้นเพื่อกรองผล</p></div>' : '');
}

document.getElementById('chips').addEventListener('click',e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  b.classList.add('on'); room = b.dataset.room; render();
});
q.addEventListener('input', render);
results.addEventListener('click', e=>{
  const b = e.target.closest('.copy'); if(!b) return;
  navigator.clipboard.writeText(b.dataset.v).then(()=>{
    b.innerHTML = iconCheck; b.classList.add('done');
    setTimeout(()=>{b.innerHTML = iconCopy; b.classList.remove('done');},1200);
  });
});
render();
</script>

</html>
